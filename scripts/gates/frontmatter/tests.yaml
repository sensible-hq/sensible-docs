# Acceptance tests for SPEC.md. Every implementation must pass every case.
# See SPEC.md "Testing" for how to run a case.

version: 0.3.0
cases:
- name: valid pair of related pages
  files:
    docs/s/a.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: [b]
      ---

      Body.
    docs/s/b.md: |
      ---
      title: T
      docops:
        page_type: how-to
        related: [a]
      ---

      Body.
  exit: 0
  problems: []
- name: all four page types are valid
  files:
    docs/t/t1.md: |
      ---
      title: T
      docops: {page_type: tutorial}
      ---

      Body.
    docs/t/t2.md: |
      ---
      title: T
      docops: {page_type: how-to}
      ---

      Body.
    docs/t/t3.md: |
      ---
      title: T
      docops: {page_type: reference}
      ---

      Body.
    docs/t/t4.md: |
      ---
      title: T
      docops: {page_type: explanation}
      ---

      Body.
  exit: 0
  problems: []
- name: empty related list is the same as none
  files:
    docs/s/a.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: []
      ---

      Body.
  exit: 0
  problems: []
- name: keys outside docops are never checked
  files:
    docs/s/a.md: |
      ---
      title: T
      excerpt: 42
      hidden: maybe
      next: {pages: nope}
      docops: {page_type: reference}
      ---

      Body.
  exit: 0
  problems: []
- name: files outside docs/ and non-.md files are ignored
  files:
    docs/s/a.md: |
      ---
      title: T
      docops: {page_type: reference}
      ---

      Body.
    README.md: |
      # no frontmatter
    reference/x/getting-started.md: |
      no frontmatter
    docs/s/notes.txt: |
      no frontmatter
  exit: 0
  problems: []
- name: index.md takes its folder's name as slug
  files:
    docs/s/preprocessors/index.md: |
      ---
      title: T
      docops:
        page_type: explanation
        related: [a]
      ---

      Body.
    docs/s/a.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: [preprocessors]
      ---

      Body.
  exit: 0
  problems: []
- name: missing docops is a warning by default
  files:
    docs/s/a.md: |
      ---
      title: T
      ---

      Body.
  exit: 0
  problems:
  - path: docs/s/a.md
    rule: missing-docops
    severity: warning
- name: --require makes missing docops an error
  args:
  - --require
  files:
    docs/s/a.md: |
      ---
      title: T
      ---

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: missing-docops
    severity: error
- name: no frontmatter
  files:
    docs/s/a.md: |
      # Title

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: no-frontmatter
    severity: error
- name: unclosed frontmatter
  files:
    docs/s/a.md: |
      ---
      title: T
      docops:
        page_type: reference
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: no-frontmatter
    severity: error
- name: frontmatter not at line 1
  files:
    docs/s/a.md: |2

      ---
      title: T
      ---
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: no-frontmatter
    severity: error
- name: invalid YAML
  files:
    docs/s/a.md: |
      ---
      title: [unclosed
      ---
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: bad-yaml
    severity: error
- name: frontmatter is a list, not a mapping
  files:
    docs/s/a.md: |
      ---
      - a
      - b
      ---
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: bad-yaml
    severity: error
- name: docops is a string
  files:
    docs/s/a.md: |
      ---
      title: T
      docops: reference
      ---
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: docops-not-mapping
    severity: error
- name: docops is empty (null)
  files:
    docs/s/a.md: |
      ---
      title: T
      docops:
      ---
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: docops-not-mapping
    severity: error
- name: unknown key under docops
  files:
    docs/s/a.md: |
      ---
      title: T
      docops: {page_type: reference, risk: high}
      ---

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: unknown-key
    severity: error
    subject: risk
- name: missing page_type
  files:
    docs/s/a.md: |
      ---
      title: T
      docops:
        related: []
      ---

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: missing-page-type
    severity: error
- name: page_type not in the list
  files:
    docs/s/a.md: |
      ---
      title: T
      docops: {page_type: guide}
      ---

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: bad-page-type
    severity: error
    subject: guide
- name: page_type is case-sensitive
  files:
    docs/s/a.md: |
      ---
      title: T
      docops: {page_type: Reference}
      ---

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: bad-page-type
    severity: error
    subject: Reference
- name: page_type that isn't a string is reported as a string
  files:
    docs/s/a.md: |
      ---
      docops:
        page_type: 3
      ---
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: bad-page-type
    severity: error
    subject: '3'
- name: related is a string, not a list
  files:
    docs/s/a.md: |
      ---
      title: T
      docops: {page_type: reference, related: b}
      ---

      Body.
    docs/s/b.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: [a]
      ---

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: related-not-list
    severity: error
  - path: docs/s/b.md
    rule: related-asymmetric
    severity: error
    subject: a
- name: related entry isn't a string
  files:
    docs/s/a.md: |
      ---
      docops:
        page_type: reference
        related: [1]
      ---
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: related-not-string
    severity: error
    subject: '1'
- name: more than 5 related entries; each entry is still checked
