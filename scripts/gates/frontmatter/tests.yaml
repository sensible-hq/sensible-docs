      docops:
        page_type: reference
        related: [a]
      ---

      Body.
    docs/s/c.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: [a]
      ---

      Body.
    docs/s/d.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: [a]
      ---

      Body.
    docs/s/e.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: [a]
      ---

      Body.
    docs/s/f.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: [a]
      ---

      Body.
    docs/s/g.md: |
      ---
      title: T
      docops: {page_type: reference}
      ---

      Body.
  exit: 1
  problems:
  - path: docs/s/a.md
    rule: related-too-many
    severity: error
  - path: docs/s/a.md
    rule: related-asymmetric
    severity: error
    subject: g
- name: entries that aren't bare slugs
  files:
    docs/s/a.md: |
      ---
      title: T
      docops:
        page_type: reference
        related: ['doc:b', b#anchor, s/b, two words, '']
