# Tracks state for the release notes → changelog workflow.
# last_message_ts: Slack message_ts of the most recent #engineering
#   release notes post fetched. Next fetch starts after this.
# latest_message_date_cursor: human-readable date of last_message_ts (for sanity checking).
# last_changelog_through: date through which items have been PUBLISHED
#   in a changelog. May lag behind last_fetched if items are pending review.
# changelog_history: append-only archive — one entry per published changelog,
#   recording which release note date range it covered.

last_fetched: "2026-08-12"
last_message_ts: "1786462900.667889"   # August 11, 2026
latest_message_date_cursor: "2026-08-11"
last_changelog_through: "2026-07-01"   # date of last published changelog

changelog_history:
  # Append a new entry each time a changelog is published.
  # release_notes_from: earliest release note batch included
  # release_notes_through: latest release note batch included
  # published: date the changelog was pushed live
  # url: published changelog URL
  - changelog: "june-2026"
    release_notes_from: "2026-05-11"
    release_notes_through: "2026-06-09"
    published: "2026-06-11"
    url: "https://docs.sensible.so/changelog/june-2026"
  - changelog: "july-2026"
    release_notes_from: "2026-06-16"
    release_notes_through: "2026-07-01"
    published: "2026-07-08"
    url: "https://docs.sensible.so/changelog/july-2026"
