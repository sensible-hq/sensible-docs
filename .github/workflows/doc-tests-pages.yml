# Runs the tests in the docs pages registered in scripts/doc-detective/config/pages.json: Doc
# Detective runs a page's UI tests, and code_tests.py runs its code tests (documented configs and
# fingerprint samples against the Sensible API, checked against the page). See
# scripts/doc-detective/README.md.
#
# One job per page, and only the pages that need it: the plan job decides (plan_pages.py).
# - push to v0: each page whose tests, or the files they use, changed. A page with a gate skips a
#   push that changed only its prose (for example, a ReadMe save).
# - monthly: every page, so product drift is caught even when nothing changes
# - manual: the pages you name (comma-separated slugs from pages.json), or all
# Not on PRs.
#
# Each page's job: on failure, opens one issue labeled doc-tests-<slug>, or comments on the open one.
# Every job shows a summary on the run's page, with a link to the page's HTML report (it opens in
# the browser), and uploads the report and records as artifacts.

name: Doc tests (pages)

on:
  push:
    branches:
      - v0
    # Every registered page, the files its tests use (watch in pages.json), and the tooling.
    # tests/test_plan_pages.py checks this list against pages.json.
    paths:
      - "docs/document extraction/getting-started.md"
      - ".doc-detective.json"
      - "docs/Senseml reference/config-settings/fingerprint.md"
      - "scripts/test/probe_endpoints/contract/fixtures/fingerprint_portfolio/**"
      - "assets/pdfs/portfolio_bank_paystub_tax.pdf"
      - "assets/pdfs/wells_fargo_checking.pdf"
      - "docs/document extraction/portfolio.md"
      - "assets/pdfs/portfolio.pdf"
      - "scripts/doc-detective/**"
      - ".github/workflows/doc-tests-pages.yml"
  workflow_dispatch:
    inputs:
      pages:
        description: "Pages to test: comma-separated slugs from scripts/doc-detective/config/pages.json, or all"
        default: "all"
  # Monthly: the 1st at 15:00 UTC. Scheduled runs use this file on the default branch (v0).
  schedule:
    - cron: "0 15 1 * *"

# Pages share the docs test account (fixture doc types, docs_ci_examples), so runs must not overlap
concurrency:
  group: doc-tests-pages
  cancel-in-progress: false

# contents and pull-requests: write only for pages with propose_fixes. The token goes only to the
# steps that open issues and PRs (GH_TOKEN), never to the test steps.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # Which pages to test. No secrets.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide which pages to test
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PAGES: ${{ inputs.pages }}
        run: |
          if [ "$EVENT" = "push" ]; then
            git fetch -q --depth=1 origin "$BEFORE" || true
          fi
          python3 scripts/doc-detective/plan_pages.py --event "$EVENT" --before "$BEFORE" --after "$GITHUB_SHA" \
            --pages "${PAGES:-all}" --summary "$GITHUB_STEP_SUMMARY" >> "$GITHUB_OUTPUT"

  test:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    name: ${{ matrix.title }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PAGE: ${{ matrix.page }}
      SLUG: ${{ matrix.slug }}
      TITLE: ${{ matrix.title }}

    steps:
      # Actions are pinned to commit SHAs, since this job holds the test account's secrets.
      # The token isn't left on disk: only the steps that open issues and PRs get it.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup node
        if: matrix.ui_tests
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Doc Detective
        if: matrix.ui_tests
        run: npm install --global doc-detective@4.38.1

      - name: Install runner dependencies
        run: pip install --target scripts/doc-detective/.deps -r scripts/doc-detective/requirements.txt

      # Offline: markup, comparison, routing to the LLM judge, and syntax checks. No secrets needed.
      - name: Unit test the runner
        run: python3 -m unittest discover -s scripts/doc-detective/tests -t scripts/doc-detective

      # Every secret this workflow, the docs' test markup, or .env uses must be classified in
      # config/secrets.txt (or config/public-vars.txt), so a new secret can't leak unnoticed. No secrets needed.
      - name: Check every secret is classified
        run: python3 scripts/doc-detective/check_secrets.py --coverage-only

      # Each page gets only the secrets its pages.json entry lists. Give the Scrub reports and Check
      # for leaked secrets steps the same list; check_secrets.py fails if a secret is missing there.
      # .doc-detective.json sets autoUpdate: false; --no-auto-update repeats it (run.sh passes it to
      # Doc Detective only for pages with UI tests). DOC_EXAMPLES_PROPOSE_FIXES makes the runner
      # rewrite drifted output blocks in place. A step timeout fails this step, so the scrub, issue,
      # and fix PR steps still run; a job timeout would cancel the job instead.
      - name: Run tests
        id: tests
        continue-on-error: true
        timeout-minutes: ${{ matrix.timeout_minutes }}
        run: scripts/doc-detective/run.sh --no-auto-update "$PAGE"
        env:
          SENSIBLE_TEST_EMAIL: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_EMAIL') && secrets.SENSIBLE_TEST_EMAIL || '' }}
          SENSIBLE_TEST_PASSWORD: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_PASSWORD') && secrets.SENSIBLE_TEST_PASSWORD || '' }}
          SENSIBLE_TEST_API_KEY: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_API_KEY') && secrets.SENSIBLE_TEST_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ contains(matrix.secrets, 'ANTHROPIC_API_KEY') && secrets.ANTHROPIC_API_KEY || '' }}
          DOC_EXAMPLES_PROPOSE_FIXES: ${{ matrix.propose_fixes && '1' || '' }}
          DOC_TESTS_MONTHLY_BUDGET: ${{ vars.DOC_TESTS_MONTHLY_BUDGET }}

      # run.sh scrubs the reports too, but not if the run was cancelled or timed out mid-way.
      # Upload only after this step succeeds: Doc Detective writes the password in plain text.
      - name: Scrub reports
        if: always()
        run: scripts/doc-detective/scrub.sh
        env:
          SENSIBLE_TEST_EMAIL: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_EMAIL') && secrets.SENSIBLE_TEST_EMAIL || '' }}
          SENSIBLE_TEST_PASSWORD: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_PASSWORD') && secrets.SENSIBLE_TEST_PASSWORD || '' }}
          SENSIBLE_TEST_API_KEY: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_API_KEY') && secrets.SENSIBLE_TEST_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ contains(matrix.secrets, 'ANTHROPIC_API_KEY') && secrets.ANTHROPIC_API_KEY || '' }}

      # Fail closed: nothing below publishes anything (fix PR, issues, summary, artifacts) unless this
      # passes. It scans every output file for each secret (as written and JSON-, HTML-, URL-, and
      # base64-encoded) and for unregistered credential shapes.
      - name: Check for leaked secrets
        id: secretcheck
        if: always()
        run: python3 scripts/doc-detective/check_secrets.py
        env:
          SENSIBLE_TEST_EMAIL: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_EMAIL') && secrets.SENSIBLE_TEST_EMAIL || '' }}
          SENSIBLE_TEST_PASSWORD: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_PASSWORD') && secrets.SENSIBLE_TEST_PASSWORD || '' }}
          SENSIBLE_TEST_API_KEY: ${{ contains(matrix.secrets, 'SENSIBLE_TEST_API_KEY') && secrets.SENSIBLE_TEST_API_KEY || '' }}
          ANTHROPIC_API_KEY: ${{ contains(matrix.secrets, 'ANTHROPIC_API_KEY') && secrets.ANTHROPIC_API_KEY || '' }}

      # The HTML report on its own, unzipped, so it opens in the browser from the run page
      - name: Name the HTML report
        id: htmlname
        if: always() && steps.secretcheck.outcome == 'success'
        run: |
          if [ -f scripts/doc-detective/output/report.html ]; then
            cp scripts/doc-detective/output/report.html "$RUNNER_TEMP/doc-tests-$SLUG-report.html"
            echo "path=$RUNNER_TEMP/doc-tests-$SLUG-report.html" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload HTML report
        id: htmlreport
        if: always() && steps.htmlname.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.htmlname.outputs.path }}
          archive: false

      # Each test's result, what it checked, and a link to the HTML report, on the run's page
      - name: Write run summary
        if: always() && steps.secretcheck.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.htmlreport.outputs.artifact-url }}
        run: python3 scripts/doc-detective/report.py summary --page "$PAGE" --run-url "$RUN_URL" ${REPORT_URL:+--report-url "$REPORT_URL"} >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update proposed docs fix PR
        id: fix_pr
        if: matrix.propose_fixes && steps.tests.outcome == 'failure' && steps.secretcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch="doc-tests/$SLUG-fixes"
          if git diff --quiet -- docs/; then
            echo "No proposed docs changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git switch -c "$branch"
          git add -- docs/
          git commit -m "Update $TITLE output to match Sensible" -m "Proposed by docs test run $RUN_URL"
          git push --force origin "$branch"
          pr=$(gh pr list --head "$branch" --state open --json url -q '.[0].url')
          if [ -z "$pr" ]; then
            pr=$(gh pr create --draft --base v0 --head "$branch" \
              --title "Doc tests: update $TITLE output to match Sensible" \
              --body "The docs tests found that the documented output in $PAGE no longer matches what Sensible returns. This PR rewrites the mismatched values to the actual ones.

          **Review before merging.** The difference can be a docs bug, a product regression (don't codify it), or LLM variation.

          Run: $RUN_URL")
          fi
          echo "url=$pr" >> "$GITHUB_OUTPUT"

      # Also when a step before the tests failed (dependencies, unit tests), so a scheduled run never fails silently
      - name: Open or update failure issue
        if: (failure() || steps.tests.outcome == 'failure') && steps.secretcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.htmlreport.outputs.artifact-url }}
          PR_URL: ${{ steps.fix_pr.outputs.url }}
        run: |
          label="doc-tests-$SLUG"
          python3 scripts/doc-detective/report.py issue --run-url "$RUN_URL" ${REPORT_URL:+--report-url "$REPORT_URL"} ${PR_URL:+--pr-url "$PR_URL"} > "$RUNNER_TEMP/issue.md"
          gh label create "$label" --color D93F0B --description "$TITLE page docs test failures" --force
          issue=$(gh issue list --label "$label" --state open --json number -q '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Doc tests: $TITLE page tests are failing" --label "$label" --body-file "$RUNNER_TEMP/issue.md"
          fi

      # A separate standing issue for envelope warnings, so they don't dilute the failure issue.
      # Comments only when the breaches change; closes when a run is back within the envelope.
      - name: Open, update, or close envelope issue
        if: always() && matrix.envelope_issue && steps.tests.outcome != 'skipped' && steps.secretcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          label="doc-tests-$SLUG-envelope"
          python3 scripts/doc-detective/report.py envelope-issue --run-url "$RUN_URL" > "$RUNNER_TEMP/envelope.json"
          state=$(jq -r .state "$RUNNER_TEMP/envelope.json")
          fingerprint=$(jq -r .fingerprint "$RUNNER_TEMP/envelope.json")
          jq -r .body "$RUNNER_TEMP/envelope.json" > "$RUNNER_TEMP/envelope.md"
          echo "Envelope state: $state"
          gh label create "$label" --color 5319E7 --description "$TITLE page: LLM regression envelope warnings" --force
          issue=$(gh issue list --label "$label" --state open --json number -q '.[0].number')
          if [ "$state" = "attention" ]; then
            if [ -z "$issue" ]; then
              gh issue create --title "Doc tests: $TITLE LLM output shifted from its regression envelope" --label "$label" --body-file "$RUNNER_TEMP/envelope.md"
            else
              last=$(gh issue view "$issue" --json body,comments -q '[.body] + [.comments[] | select(.author.login == "github-actions" or .author.login == "app/github-actions") | .body] | join("\n")' | grep -o 'envelope-fingerprint: [a-f0-9]*' | tail -1 | cut -d' ' -f2)
              if [ "$last" != "$fingerprint" ]; then
                gh issue comment "$issue" --body-file "$RUNNER_TEMP/envelope.md"
              else
                echo "Same breaches as the last report on #$issue; not commenting"
              fi
            fi
          elif [ "$state" = "clear" ] && [ -n "$issue" ]; then
            gh issue close "$issue" --comment "$(cat "$RUNNER_TEMP/envelope.md")"
          fi

      - name: Upload reports
        if: always() && steps.secretcheck.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-tests-${{ matrix.slug }}-reports
          path: scripts/doc-detective/output/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Fail the job if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
