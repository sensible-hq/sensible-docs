name: Test scripts

on:
  pull_request:
    paths:
      - 'scripts/descriptions/**'
      - 'scripts/llms_txt/**'
      - 'scripts/style_images/**'
      - 'scripts/gates/public_diff_paths/**'
      - '.github/workflows/test-scripts.yml'
  push:
    branches:
      - v0
    paths:
      - 'scripts/descriptions/**'
      - 'scripts/llms_txt/**'
      - 'scripts/style_images/**'
      - 'scripts/gates/public_diff_paths/**'
      - '.github/workflows/test-scripts.yml'

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite:
          - scripts/descriptions/test/tests
          - scripts/llms_txt/test/tests
          - scripts/style_images/test/tests
          - scripts/gates/public_diff_paths/test/tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml pytest

      - name: Run tests
        working-directory: ${{ matrix.suite }}
        run: python -m pytest -q
