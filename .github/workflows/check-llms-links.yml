name: Check llms.txt links

on:
  push:
    branches:
      - v0
    paths:
      - 'llms.txt'

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check llms.txt links
        run: python scripts/llms_txt/check_links.py
