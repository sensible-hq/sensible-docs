name: Style linting
on:
  pull_request:
    paths:
      - 'docs/**.md'
      - 'reference/**.md'

jobs:
  vale:
    name: runner / vale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vale-cli/vale-action@v2.1.1
        with:
          files: '["docs", "reference"]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
