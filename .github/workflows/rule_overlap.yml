name: Style rule overlap

# Weekly: look for style rules that duplicate, overlap, or contradict each other, using Vale fixtures,
# wording similarity, and Jev. The run fails on a pair not recorded in style-rules/overlaps.yaml; pairs
# recorded as unreviewed are listed without failing. The report is the job summary.
# Settle a pair in style-rules/overlaps.yaml, or add `overrides` to the winning rule in the registry.

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml
          curl -sSL https://github.com/errata-ai/vale/releases/download/v3.25.1/vale_3.25.1_Linux_64-bit.tar.gz | sudo tar -xz -C /usr/local/bin vale

      - name: Restore Jev answers from earlier runs
        uses: actions/cache/restore@v4
        with:
          path: .cache/rule-overlap.json
          key: rule-overlap-${{ github.run_id }}
          restore-keys: rule-overlap-

      - name: Check rule pairs
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python3 scripts/style/check_overlap.py --jev --report overlap-report.md

      # Save even when the check fails: a failing run is the usual case while a pair is open, and
      # without its answers the next run re-asks every pair and borderline verdicts can flip.
      - name: Save Jev answers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/rule-overlap.json
          key: rule-overlap-${{ github.run_id }}

      - name: Publish report
        if: always()
        run: test -f overlap-report.md && cat overlap-report.md >> "$GITHUB_STEP_SUMMARY" || true
