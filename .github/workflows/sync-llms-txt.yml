name: Sync llms.txt from frontmatter

on:
  push:
    branches:
      - v0
    paths:
      - '**/*.md'

jobs:
  sync-llms-txt:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check for existing PR
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --state open --search "Sync llms.txt descriptions from frontmatter" --json number --jq 'length')
          echo "count=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "::notice::Skipping - existing PR already open for syncing llms.txt"
          fi

      - name: Check for llms.txt sync needed
        if: steps.existing_pr.outputs.count == '0'
        id: check
        run: |
          # Show human-readable output in logs
          ./scripts/descriptions/sync_descriptions_to_llms.py --dry-run

          # Capture JSON output for subsequent steps
          RESULT=$(./scripts/descriptions/sync_descriptions_to_llms.py --json)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          UPDATE_COUNT=$(echo "$RESULT" | jq '.updates | length')
          echo "update_count=$UPDATE_COUNT" >> "$GITHUB_OUTPUT"

      - name: Sync llms.txt
        if: steps.existing_pr.outputs.count == '0' && steps.check.outputs.update_count != '0'
        run: |
          ./scripts/descriptions/sync_descriptions_to_llms.py

      - name: Create Pull Request
        if: steps.existing_pr.outputs.count == '0' && steps.check.outputs.update_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECK_RESULT: ${{ steps.check.outputs.result }}
        run: |
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch
          BRANCH_NAME="auto/sync-llms-txt-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git add llms.txt
          git commit -m "Sync llms.txt descriptions from frontmatter"

          # Push and create PR
          git push origin "$BRANCH_NAME"

          # Get list of updated descriptions from the check step
          UPDATES=$(echo "$CHECK_RESULT" | jq -r '.updates[] | "- \(.path)"')

          gh pr create \
            --title "Sync llms.txt descriptions from frontmatter" \
            --body "This PR syncs llms.txt descriptions with the metadata.description values in the markdown frontmatter.

          ## Files with updated descriptions
          $UPDATES

          ---
          *Generated by GitHub Actions*" \
            --head "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}"

      - name: Fail if sync was needed
        if: steps.check.outputs.update_count != '0' && steps.check.outputs.update_count != ''
        run: |
          echo "::error::llms.txt descriptions were out of sync and a PR has been created to fix them."
          echo "Please review and merge the PR."
          exit 1
