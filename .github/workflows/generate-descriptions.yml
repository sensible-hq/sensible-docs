name: Generate Missing Descriptions

on:
  push:
    branches:
      - v0
    paths:
      - '**/*.md'

jobs:
  generate-descriptions:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check for existing PR
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Match the bot's branch prefix; a text search also matches PRs that merely mention the title.
          EXISTING_PR=$(gh pr list --state open --limit 100 --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("claude/add-excerpts-"))] | length')
          echo "count=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "::notice::Skipping - existing PR already open for adding excerpts"
          fi

      - name: Fix invalid frontmatter
        if: steps.existing_pr.outputs.count == '0'
        id: fix
        run: |
          RESULT=$(python scripts/descriptions/fix_frontmatter.py --json)
          echo "$RESULT" | jq -r '.fixed[] | "Fixed: \(.)"'
          UNFIXABLE=$(echo "$RESULT" | jq -c '.unfixable')
          echo "unfixable=$UNFIXABLE" >> "$GITHUB_OUTPUT"
          echo "unfixable_count=$(echo "$UNFIXABLE" | jq length)" >> "$GITHUB_OUTPUT"

      - name: Generate missing excerpts with Claude
        if: steps.existing_pr.outputs.count == '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Per-file failures are reported as warnings; the remaining check below catches them.
          python scripts/descriptions/generate_excerpts.py --missing \
            || echo "::warning::Some excerpts could not be generated"

      - name: Shorten excerpts over 160 characters
        if: steps.existing_pr.outputs.count == '0'
        run: python scripts/descriptions/shorten_excerpt.py

      - name: Sync metadata.description from excerpts
        if: steps.existing_pr.outputs.count == '0'
        run: python scripts/descriptions/sync_description.py

      - name: Check results
        if: steps.existing_pr.outputs.count == '0'
        id: status
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          # Files still missing an excerpt, apart from unfixable frontmatter (reported in its own issue).
          REMAINING=$(python scripts/descriptions/check_excerpt.py --json \
            | jq '[.[] | select(.reason | startswith("Invalid YAML") | not)] | length')
          echo "remaining=$REMAINING" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.existing_pr.outputs.count == '0' && steps.status.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="claude/add-excerpts-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          git add -A
          git commit -m "Add missing excerpts, fix frontmatter, and sync metadata.description"

          git push origin "$BRANCH_NAME"

          FILES_CHANGED=$(git diff --name-only HEAD~1 | sed 's/^/- /')

          gh pr create \
            --title "Add missing excerpts" \
            --body "This PR adds missing excerpts to documentation files, repairs invalid YAML frontmatter, shortens excerpts over 160 characters, and syncs \`metadata.description\` to match.

          Frontmatter repairs are mechanical (re-joining wrapped lines, quoting values that contain \`: \`). Shortening is rule-based (dropping openers like \"Learn how to\", then trailing clauses or list items). Check the diff for those files.

          Excerpts were automatically generated by Claude based on the content of each file. \`excerpt\` is the source of truth — \`metadata.description\` is derived from it.

          ## Files updated
          $FILES_CHANGED

          ---
          *Generated by GitHub Actions*" \
            --head "$BRANCH_NAME" \
            --base ${{ github.event.repository.default_branch }}

      - name: Open issue for frontmatter that couldn't be auto-fixed
        if: steps.existing_pr.outputs.count == '0' && steps.fix.outputs.unfixable_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UNFIXABLE: ${{ steps.fix.outputs.unfixable }}
        run: |
          TITLE="Invalid frontmatter needs a manual fix"
          BODY=$(echo "$UNFIXABLE" | jq -r '"These files have YAML frontmatter that `scripts/descriptions/fix_frontmatter.py` could not repair. The excerpt workflow skips them until they are fixed.\n\n" + (map("### `\(.path)`\n```\n\(.error)\n```") | join("\n\n"))')
          EXISTING=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
          echo "$UNFIXABLE" | jq -r '.[] | "::error file=\(.path)::Invalid frontmatter could not be auto-fixed"'

      - name: Fail if changes were needed
        if: steps.existing_pr.outputs.count == '0' && (steps.status.outputs.has_changes == 'true' || steps.status.outputs.remaining != '0' || steps.fix.outputs.unfixable_count != '0')
        run: |
          echo "::error::Missing excerpts, out-of-sync descriptions, or invalid frontmatter were found."
          echo "Please review and merge the PR, and fix any files listed in the open 'Invalid frontmatter' issue."
          exit 1
