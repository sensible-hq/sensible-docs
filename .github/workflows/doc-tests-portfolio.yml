# Runs the code tests in the Portfolios page (portfolio.md): the fingerprint example's two samples,
# each run as written in its own sample doc type, as a fingerprint-segmented portfolio extraction,
# checked against the documents in the page's example response. Deterministic: no LLM judge.
# See scripts/doc-detective/README.md.
#
# Runs on pushes to v0 that change the page's tests, its example document, or the test tooling, monthly,
# and on demand; not on PRs. A push that changes only the page's prose (for example, a ReadMe
# save) skips the tests: should_run.py decides.
#
# On failure: opens one issue labeled doc-tests-portfolio, or comments on the open one.
# Every run shows a summary on its page, with a link to the HTML report (it opens in the browser),
# and uploads the report and records as an artifact.

name: Doc tests (portfolio)

on:
  push:
    branches:
      - v0
    # Keep in step with the --watch list in the changes job below
    paths:
      - "docs/document extraction/portfolio.md"
      - "assets/pdfs/portfolio.pdf"
      - "scripts/doc-detective/**"
      - ".github/workflows/doc-tests-portfolio.yml"
  workflow_dispatch:
  # Monthly, so product drift is caught even when nothing changes: the 1st at 15:45 UTC,
  # after the fingerprint run.
  schedule:
    - cron: "45 15 1 * *"

# The tests' sample doc types are named for them, so runs of this workflow must not overlap.
concurrency:
  group: doc-tests-portfolio
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # Skips the test job when a push changed only the page's prose. No secrets.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide whether to run the tests
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch -q --depth=1 origin "$BEFORE" || true
          python3 scripts/doc-detective/should_run.py --page "docs/document extraction/portfolio.md" \
            --before "$BEFORE" --after "$GITHUB_SHA" \
            --watch "assets/pdfs/portfolio.pdf" "scripts/doc-detective/**" ".github/workflows/doc-tests-portfolio.yml" \
            >> "$GITHUB_OUTPUT" 2> "$RUNNER_TEMP/reason.txt"
          cat "$RUNNER_TEMP/reason.txt"
          { echo "## Docs tests"; echo; cat "$RUNNER_TEMP/reason.txt"; } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Actions are pinned to commit SHAs, since this job holds the test account's API key.
      # The job never pushes, so the token isn't left on disk for later steps.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install runner dependencies
        run: pip install --target scripts/doc-detective/.deps -r scripts/doc-detective/requirements.txt

      # Offline: markup, comparison, and syntax checks. No secrets needed.
      - name: Unit test the runner
        run: python3 -m unittest discover -s scripts/doc-detective/tests -t scripts/doc-detective

      # Every secret this workflow uses must be classified in config/secrets.txt. No secrets needed.
      - name: Check every secret is classified
        run: python3 scripts/doc-detective/check_secrets.py --coverage-only

      # The page has no UI tests, so run.sh skips Doc Detective. Secrets come from env vars only.
      # Keep this list in step with scripts/doc-detective/config/secrets.txt, which run.sh scrubs.
      # DOC_TESTS_MONTHLY_BUDGET (repo variable, optional): the report shows usage against it.
      # A step timeout fails this step, so the issue still opens; a job timeout would skip that.
      # 1 portfolio extraction; it usually takes under a minute.
      - name: Run tests
        id: tests
        continue-on-error: true
        timeout-minutes: 10
        run: scripts/doc-detective/run.sh "docs/document extraction/portfolio.md"
        env:
          SENSIBLE_TEST_API_KEY: ${{ secrets.SENSIBLE_TEST_API_KEY }}
          DOC_TESTS_MONTHLY_BUDGET: ${{ vars.DOC_TESTS_MONTHLY_BUDGET }}

      # run.sh scrubs and checks the reports too, but not if the run timed out mid-way
      - name: Scrub reports
        if: always()
        run: scripts/doc-detective/scrub.sh
        env:
          SENSIBLE_TEST_API_KEY: ${{ secrets.SENSIBLE_TEST_API_KEY }}

      # Fail closed: nothing below publishes anything (issue, summary, artifact) unless this passes
      - name: Check for leaked secrets
        id: secretcheck
        if: always()
        run: python3 scripts/doc-detective/check_secrets.py
        env:
          SENSIBLE_TEST_API_KEY: ${{ secrets.SENSIBLE_TEST_API_KEY }}

      # The HTML report on its own, unzipped, so it opens in the browser from the run page
      - name: Name the HTML report
        id: htmlname
        if: always() && steps.secretcheck.outcome == 'success'
        run: |
          if [ -f scripts/doc-detective/output/report.html ]; then
            cp scripts/doc-detective/output/report.html "$RUNNER_TEMP/doc-tests-portfolio-report.html"
            echo "path=$RUNNER_TEMP/doc-tests-portfolio-report.html" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload HTML report
        id: htmlreport
        if: always() && steps.htmlname.outputs.path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.htmlname.outputs.path }}
          archive: false

      # Each test's result, what it checked, and a link to the HTML report, on the run's page
      - name: Write run summary
        if: always() && steps.secretcheck.outcome == 'success'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.htmlreport.outputs.artifact-url }}
        run: python3 scripts/doc-detective/report.py summary --page "docs/document extraction/portfolio.md" --run-url "$RUN_URL" ${REPORT_URL:+--report-url "$REPORT_URL"} >> "$GITHUB_STEP_SUMMARY"

      # Also when a step before the tests failed (dependencies, unit tests), so a scheduled run never fails silently
      - name: Open or update failure issue
        if: (failure() || steps.tests.outcome == 'failure') && steps.secretcheck.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: ${{ steps.htmlreport.outputs.artifact-url }}
        run: |
          python3 scripts/doc-detective/report.py issue --run-url "$RUN_URL" ${REPORT_URL:+--report-url "$REPORT_URL"} > "$RUNNER_TEMP/issue.md"
          gh label create doc-tests-portfolio --color D93F0B --description "Portfolio page docs test failures" --force
          issue=$(gh issue list --label doc-tests-portfolio --state open --json number -q '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "Doc tests: Portfolio page tests are failing" --label doc-tests-portfolio --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Upload reports
        if: always() && steps.secretcheck.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: doc-tests-portfolio-reports
          path: scripts/doc-detective/output/
          include-hidden-files: true
          if-no-files-found: warn

      - name: Fail the job if tests failed
        if: always() && steps.tests.outcome == 'failure'
        run: exit 1
