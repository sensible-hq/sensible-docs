name: "[TEST] Sync llms.txt to docs"

# Branch-scoped copy of sync-llmstxt.yml for integration testing.
# Triggers on the llms-order-yaml branch so test runs don't affect
# production (v0) and PRs target this branch, not v0.
# Descriptions phase is disabled — tests focus on llms.txt generation only.
on:
  push:
    branches:
      - llms-order-yaml
    paths:
      - '**/_order.yaml'
      - 'reference/*.json'

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check for existing PR
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --state open --search "Sync docs and llms.txt" \
            --json number,headRefName --jq '.[0] // empty')
          if [ -n "$EXISTING" ]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "pr_number=$(echo "$EXISTING" | jq -r '.number')" >> "$GITHUB_OUTPUT"
            echo "branch=$(echo "$EXISTING" | jq -r '.headRefName')" >> "$GITHUB_OUTPUT"
            echo "::notice::Existing PR found — will update instead of creating a new one"
          else
            echo "mode=create" >> "$GITHUB_OUTPUT"
          fi

      # === Regenerate llms.txt from _order.yaml ===

      - name: Validate _order.yaml slugs
        run: |
          echo "=== Checking _order.yaml for stale slugs ==="
          python scripts/llms_txt/generate.py --check || true

      - name: Generate llms.txt
        id: generate
        run: |
          echo "=== Generating llms.txt from _order.yaml ==="
          python scripts/llms_txt/generate.py

          if git diff --quiet llms.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::llms.txt was updated"
          fi

      # Link checker intentionally omitted — test pages don't exist in production.

      # === Create or update PR if llms.txt changed ===

      - name: Create or update PR
        if: steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRIGGER_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          MODE: ${{ steps.existing_pr.outputs.mode }}
          PR_NUMBER: ${{ steps.existing_pr.outputs.pr_number }}
          PR_BRANCH: ${{ steps.existing_pr.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          TRIGGER_SHORT="${TRIGGER_SHA:0:7}"
          TRIGGER_URL="https://github.com/$REPO/commit/$TRIGGER_SHA"

          git add -A
          git commit -m "Sync docs and llms.txt (trigger: $TRIGGER_SHORT)"

          AUTO_SHA=$(git rev-parse HEAD)
          AUTO_SHORT="${AUTO_SHA:0:7}"
          AUTO_URL="https://github.com/$REPO/commit/$AUTO_SHA"
          NEW_ROW="| [\`$AUTO_SHORT\`]($AUTO_URL) | [\`$TRIGGER_SHORT\`]($TRIGGER_URL) |"

          if [ "$MODE" = "update" ]; then
            git push origin HEAD:refs/heads/$PR_BRANCH --force
            CURRENT_BODY=$(gh pr view "$PR_NUMBER" --json body --jq '.body')
            NEW_BODY=$(printf '%s\n%s' "$CURRENT_BODY" "$NEW_ROW")
            gh pr edit "$PR_NUMBER" --body "$NEW_BODY"
            echo "::notice::Updated PR #$PR_NUMBER"
          else
            BRANCH_NAME="auto/sync-docs-$(date +%Y%m%d-%H%M%S)"
            git push origin HEAD:refs/heads/$BRANCH_NAME
            BODY=$(printf 'This PR automatically syncs llms.txt and llms-txt.md.\n\n## Trigger history\n\n| Auto commit | Trigger commit |\n|---|---|\n%s' "$NEW_ROW")
            gh pr create \
              --title "Sync docs and llms.txt" \
              --body "$BODY" \
              --head "$BRANCH_NAME" \
              --base "llms-order-yaml"
          fi

      - name: Fail if llms.txt changed
        if: steps.generate.outputs.changed == 'true'
        run: |
          echo "::error::llms.txt changed — a PR has been created or updated."
          exit 1
