name: "[TEST] Sync llms.txt to docs"

# Branch-scoped copy of sync-llmstxt.yml for integration testing.
# Triggers on the llms-order-yaml branch so test runs don't affect
# production (v0) and PRs target this branch, not v0.
# Descriptions phase is disabled — tests focus on llms.txt generation only.
on:
  push:
    branches:
      - llms-order-yaml
    paths:
      - '**/_order.yaml'
      - 'reference/*.json'

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Check for existing PR
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --state open --search "Sync docs and llms.txt" --json number --jq 'length')
          echo "count=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "::notice::Skipping - existing PR already open"
          fi

      # === Regenerate llms.txt from _order.yaml ===

      - name: Validate _order.yaml slugs
        if: steps.existing_pr.outputs.count == '0'
        run: |
          echo "=== Checking _order.yaml for stale slugs ==="
          python scripts/llms_txt/generate.py --check || true

      - name: Generate llms.txt
        if: steps.existing_pr.outputs.count == '0'
        id: generate
        run: |
          echo "=== Generating llms.txt from _order.yaml ==="
          python scripts/llms_txt/generate.py

          if git diff --quiet llms.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::llms.txt was updated"
          fi

      - name: Check llms.txt links
        if: steps.existing_pr.outputs.count == '0'
        run: |
          echo "=== Checking llms.txt links ==="
          python scripts/llms_txt/check_links.py

      # === Create PR if llms.txt changed ===

      - name: Create Pull Request
        if: steps.existing_pr.outputs.count == '0' && steps.generate.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="auto/sync-docs-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          git add -A
          git commit -m "Sync docs and llms.txt"

          git push origin "$BRANCH_NAME"

          FILES_CHANGED=$(git diff --name-only HEAD~1 | sed 's/^/- /')

          gh pr create \
            --title "Sync docs and llms.txt" \
            --body "$(cat <<EOF
          This PR automatically syncs llms.txt and llmstxt-1.md.

          ## Summary
          - llms.txt regenerated: ${{ steps.generate.outputs.changed }}

          ## Files changed
          $FILES_CHANGED

          ---
          *Generated by GitHub Actions (test workflow)*
          EOF
          )" \
            --head "$BRANCH_NAME" \
            --base "llms-order-yaml"

      - name: Fail if llms.txt changed
        if: steps.generate.outputs.changed == 'true'
        run: |
          echo "::error::llms.txt changed — a PR has been created."
          exit 1
