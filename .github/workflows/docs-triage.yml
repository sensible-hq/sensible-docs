name: Docs triage for sensible PRs

# Twice a week, ask Jev which recently merged sensible-hq/sensible PRs need docs, and add
# docs_needed_ai or docs_triage_ai to them. See scripts/docs_triage/README.md.
#
# This repo is public and sensible is private: anyone can read this workflow's logs, so the
# script prints only counts and PR numbers. Don't add steps that print PR content, upload
# artifacts, or write a job summary.

on:
  schedule:
    - cron: '0 14 * * 1,4'  # Monday and Thursday, 14:00 UTC
  workflow_dispatch:
    inputs:
      since_days:
        description: 'Look back this many days'
        default: '4'
      dry_run:
        description: 'Score without labeling'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-triage
  cancel-in-progress: false

jobs:
  triage:
    if: github.repository == 'sensible-hq/sensible-docs'
    runs-on: ubuntu-latest
    # The environment holds the secrets; restrict it to the v0 branch in repo settings.
    environment: docs-triage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # A GitHub App token scoped to sensible only, with Contents: read and Pull requests: write.
      - name: Get a token for sensible
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.DOCS_TRIAGE_APP_ID }}
          private-key: ${{ secrets.DOCS_TRIAGE_APP_PRIVATE_KEY }}
          owner: sensible-hq
          repositories: sensible

      - name: Label PRs that need docs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          SINCE_DAYS: ${{ inputs.since_days || '4' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python scripts/docs_triage/triage.py --since-days "$SINCE_DAYS" $DRY_RUN
