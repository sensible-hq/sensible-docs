name: Claude PR on Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  respond-to-mention:
    runs-on: ubuntu-latest
    # Trigger when @claude is mentioned (case-insensitive)
    if: contains(github.event.comment.body, '@claude') || contains(github.event.comment.body, '@Claude')

    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create branch and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create a unique branch name
          BRANCH_NAME="claude/test-pr-$(date +%Y%m%d-%H%M%S)"

          # Create and switch to new branch
          git checkout -b "$BRANCH_NAME"

          # Create the test file
          echo "testing 123" > text.md

          # Commit the change
          git add text.md
          git commit -m "Add test file via Claude mention"

          # Push the branch
          git push origin "$BRANCH_NAME"

          # Create the PR
          gh pr create \
            --title "Test PR from Claude mention" \
            --body "This PR was automatically created because @claude was mentioned in #${{ github.event.issue.number || github.event.pull_request.number }}.

## What this PR does
Adds a test file \`text.md\` with the contents \`testing 123\`.

---
*Triggered by: @${{ github.event.comment.user.login }}*" \
            --head "$BRANCH_NAME" \
            --base main
