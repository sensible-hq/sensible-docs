name: Claude Smart Docs Update
on:
  issue_comment:
    types: [created]
  commit_comment:
    types: [created]

jobs:
  claude-smart-update:
    if: >
      contains(github.event.comment.body, '@claude') && 
      (contains(github.event.comment.body, 'llms.txt') || contains(github.event.comment.body, 'llm.txt'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. Detect changed markdown files automatically
      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.md

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            USER REQUEST: "${{ github.event.comment.body }}"
            
            AUTOMATIC CONTEXT (Changed MD files):
            ${{ steps.changed-files.outputs.all_changed_files }}

            INSTRUCTIONS:
            1. If the USER REQUEST mentions specific files to add/remove from 'llms.txt', prioritize those.
            2. Otherwise, use the AUTOMATIC CONTEXT list to synchronize 'llms.txt'.
            3. Create a branch named 'fix/update-llms-txt', commit the changes, and open a PR using 'gh pr create'.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
