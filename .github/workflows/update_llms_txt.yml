name: update LLMs.txt on claude mention
on:
  issue_comment:
    types: [created]

jobs:
  claude-smart-update:
    if: >
      contains(github.event.comment.body, '@claude') && 
      (contains(github.event.comment.body, 'llms.txt') || contains(github.event.comment.body, 'llm.txt'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Get history to find changes

      # Step 1: Detect exactly which .md files changed in the PR or last commit
      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.md

      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          # Step 2: Feed specific file names into the prompt for efficiency
          prompt: |
            The user wants to update 'llms.txt'.
            
            CONTEXT: The following markdown files were recently added, modified, or deleted:
            ${{ steps.changed-files.outputs.all_changed_files }}
            
            TASK:
            1. Create a new branch 'docs/sync-llms-txt'.
            2. Update 'llms.txt' to reflect these changes while ensuring the rest of the file remains accurate.
            3. Use 'gh pr create' to open a PR targeting main.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
