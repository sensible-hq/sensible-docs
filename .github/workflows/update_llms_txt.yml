name: Claude Smart Docs Update
on:
  issue_comment:
    types: [created]

jobs:
  claude-smart-update:
    # Only run on PR comments (not regular issue comments)
    if: >
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') && 
      (contains(github.event.comment.body, 'llms.txt') || contains(github.event.comment.body, 'llm.txt'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Get changed markdown files
        id: changed-files
        run: |
          # Get the PR number from the issue
          PR_NUMBER=${{ github.event.issue.number }}
          
          # Fetch PR details to get base and head refs
          gh pr view $PR_NUMBER --json baseRefName,headRefName --jq '{base: .baseRefName, head: .headRefName}' > pr_info.json
          BASE=$(jq -r '.base' pr_info.json)
          HEAD=$(jq -r '.head' pr_info.json)
          
          # Get changed markdown files
          git fetch origin $BASE $HEAD
          CHANGED_FILES=$(git diff --name-only origin/$BASE...origin/$HEAD -- '*.md' | tr '\n' ' ')
          
          echo "all_changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            USER REQUEST: "${{ github.event.comment.body }}"
            
            AUTOMATIC CONTEXT (Changed MD files):
            ${{ steps.changed-files.outputs.all_changed_files }}
            
            INSTRUCTIONS:
            1. If the USER REQUEST mentions specific files to add/remove from 'llms.txt', prioritize those.
            2. Otherwise, use the AUTOMATIC CONTEXT list to synchronize 'llms.txt'.
            3. Create a branch named 'fix/update-llms-txt', commit the changes, and open a PR using 'gh pr create'.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}