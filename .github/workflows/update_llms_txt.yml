name: Claude Smart Docs Update
on:
  issue_comment:
    types: [created]

jobs:
  claude-smart-update:
    if: >
      contains(github.event.comment.body, '@claude') && 
      (contains(github.event.comment.body, 'llms.txt') || contains(github.event.comment.body, 'llm.txt'))
    
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Check if comment is on PR or Issue
        id: context
        run: |
          if [ -n "${{ github.event.issue.pull_request }}" ]; then
            echo "is_pr=true" >> $GITHUB_OUTPUT
            echo "context_type=PR" >> $GITHUB_OUTPUT
          else
            echo "is_pr=false" >> $GITHUB_OUTPUT
            echo "context_type=Issue" >> $GITHUB_OUTPUT
          fi
        
      - name: Get changed markdown files (PR only)
        if: steps.context.outputs.is_pr == 'true'
        id: changed-files
        run: |
          # Get the PR number from the issue
          PR_NUMBER=${{ github.event.issue.number }}
          
          # Fetch PR details to get base and head refs
          gh pr view $PR_NUMBER --json baseRefName,headRefName --jq '{base: .baseRefName, head: .headRefName}' > pr_info.json
          BASE=$(jq -r '.base' pr_info.json)
          HEAD=$(jq -r '.head' pr_info.json)
          
          # Get changed markdown files
          git fetch origin $BASE $HEAD
          CHANGED_FILES=$(git diff --name-only origin/$BASE...origin/$HEAD -- '*.md' | tr '\n' ' ')
          
          echo "all_changed_files=$CHANGED_FILES" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get all markdown files (Issue only)
        if: steps.context.outputs.is_pr == 'false'
        id: all-files
        run: |
          # For regular issues, list all markdown files in the repo
          ALL_MD_FILES=$(find . -name "*.md" -not -path "*/\.*" | tr '\n' ' ')
          echo "all_md_files=$ALL_MD_FILES" >> $GITHUB_OUTPUT
            
      - name: Run Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          auto_approve: true
          prompt: |
            USER REQUEST: "${{ github.event.comment.body }}"
            
            CONTEXT TYPE: ${{ steps.context.outputs.context_type }}
            
            ${{ steps.context.outputs.is_pr == 'true' && format('CHANGED MD FILES (from PR): {0}', steps.changed-files.outputs.all_changed_files) || format('ALL MD FILES (from repo): {0}', steps.all-files.outputs.all_md_files) }}
            
            INSTRUCTIONS:
            1. If the USER REQUEST mentions specific files to add/remove from 'llms.txt', prioritize those.
            2. For PR context: Use the CHANGED MD FILES list to synchronize 'llms.txt'.
            3. For Issue context: Use the USER REQUEST to determine which files to add/remove from 'llms.txt'.
            4. Create a branch named 'fix/update-llms-txt', commit the changes, and open a PR using 'gh pr create'.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}