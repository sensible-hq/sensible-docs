name: Check llms.txt coverage

on:
  push:
    branches:
      - v0
    paths:
      - '**/*.md'
      - 'llms.txt'

jobs:
  check-coverage:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit to detect adds/deletes

      - name: Check for relevant changes
        id: check_files
        run: |
          # Get list of added (A) or deleted (D) .md files
          MD_CHANGES=$(git diff --name-status HEAD~1 HEAD -- '*.md' | grep -E '^[AD]' || true)

          # Check if llms.txt was modified
          LLMS_CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'llms.txt' || true)

          if [ -n "$MD_CHANGES" ]; then
            echo "Detected added/deleted .md files:"
            echo "$MD_CHANGES"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$LLMS_CHANGED" ]; then
            echo "Detected llms.txt modification"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant changes (no .md adds/deletes, no llms.txt edits)"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check_files.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_files.outputs.has_changes == 'true'
        run: pip install pyyaml

      - name: Check llms.txt coverage
        if: steps.check_files.outputs.has_changes == 'true'
        id: coverage
        run: |
          # Show human-readable output in logs
          ./scripts/descriptions/check_llms_coverage.py

          # Check for issues
          RESULT=$(./scripts/descriptions/check_llms_coverage.py --json)
          MISSING=$(echo "$RESULT" | jq '.missing | length')
          ORPHANED=$(echo "$RESULT" | jq '.orphaned | length')
          HIDDEN=$(echo "$RESULT" | jq '.hidden_in_llms | length')
          IGNORED=$(echo "$RESULT" | jq '.ignored_in_llms | length')
          DUPLICATES=$(echo "$RESULT" | jq '.duplicates | length')

          TOTAL=$((MISSING + ORPHANED + HIDDEN + IGNORED + DUPLICATES))
          echo "issue_count=$TOTAL" >> "$GITHUB_OUTPUT"

          if [ "$TOTAL" -gt 0 ]; then
            echo ""
            echo "::warning::llms.txt coverage issues: $MISSING missing, $ORPHANED orphaned, $HIDDEN hidden, $IGNORED ignored, $DUPLICATES duplicates"
          fi

      - name: Check for existing PR
        if: steps.check_files.outputs.has_changes == 'true' && steps.coverage.outputs.issue_count != '0'
        id: existing_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list --state open --search "Fix llms.txt coverage" --json number --jq 'length')
          echo "count=$EXISTING_PR" >> "$GITHUB_OUTPUT"
          if [ "$EXISTING_PR" -gt 0 ]; then
            echo "::notice::Skipping - existing PR already open for fixing llms.txt"
          fi

      - name: Fix llms.txt coverage
        if: steps.check_files.outputs.has_changes == 'true' && steps.coverage.outputs.issue_count != '0' && steps.existing_pr.outputs.count == '0'
        id: fix
        run: |
          # Apply fixes and capture JSON output
          ./scripts/descriptions/check_llms_coverage.py --fix

          RESULT=$(./scripts/descriptions/check_llms_coverage.py --json)
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"

      - name: Create Pull Request
        if: steps.check_files.outputs.has_changes == 'true' && steps.coverage.outputs.issue_count != '0' && steps.existing_pr.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIX_RESULT: ${{ steps.fix.outputs.result }}
        run: |
          # Check if there are changes
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create branch
          BRANCH_NAME="claude/fix-llms-coverage-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"

          # Commit changes
          git add llms.txt
          git commit -m "Fix llms.txt coverage issues"

          # Push and create PR
          git push origin "$BRANCH_NAME"

          # Build PR body (fix results are nested under 'fixed')
          REMOVED=$(echo "$FIX_RESULT" | jq -r '.fixed.removed[] | "- \(.path) (\(.reason))"' 2>/dev/null || echo "None")
          ADDED=$(echo "$FIX_RESULT" | jq -r '.fixed.added[] | "- \(.path)"' 2>/dev/null || echo "None")

          BODY="This PR automatically fixes llms.txt coverage issues.

          ## Entries removed
          ${REMOVED:-None}

          ## Entries added
          ${ADDED:-None}

          ---
          *Generated by GitHub Actions*"

          gh pr create \
            --title "Fix llms.txt coverage" \
            --body "$BODY" \
            --head "$BRANCH_NAME" \
            --base "${{ github.event.repository.default_branch }}"

      - name: Fail if issues were found
        if: steps.coverage.outputs.issue_count != '0' && steps.coverage.outputs.issue_count != ''
        run: |
          echo "::error::llms.txt coverage issues were found and a PR has been created to fix them."
          echo "Please review and merge the PR."
          exit 1
