extends: substitution
message: "Use '%s' instead of '%s'."
link: "https://developers.google.com/style/word-list"
level: warning
# The case-sensitive half of the Google developer style word list. The
# case-insensitive half is Google.WordListCase, which is enabled, so entries
# it covers were removed from here to stop the same match alerting twice.
ignorecase: false
action:
  name: replace
swap:
  Ajax: AJAX
  Android device: Android-powered device
  android: Android
  API explorer: APIs Explorer
  authN: authentication
  authZ: authorization
  CLI: command-line tool
  Cloud: Google Cloud Platform|GCP
  Container Engine: Kubernetes Engine
  Developers Console: Google API Console|API Console
  Google account: Google Account
  Google accounts: Google Accounts
  Googling: search with Google
  HTTPs: HTTPS
  k8s: Kubernetes
  SHA1: SHA-1|HAS-SHA1
  url: URL
  World Wide Web: web
