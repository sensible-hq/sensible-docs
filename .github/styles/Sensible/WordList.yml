extends: substitution
message: "Use '%s' instead of '%s'."
link: "https://developers.google.com/style/word-list"
level: warning
# The case-sensitive entries of the Google word list (Google.WordList is off in .vale.ini).
# Entries that are also in Google.WordListCase were removed so a word is flagged once.
ignorecase: false
action:
  name: replace
swap:
  "(?:OAuth ?2|Oauth)": OAuth 2.0
  Ajax: AJAX
  Android device: Android-powered device
  android: Android
  API explorer: APIs Explorer
  authN: authentication
  authZ: authorization
  CLI: command-line tool
  Cloud: Google Cloud Platform|GCP
  Container Engine: Kubernetes Engine
  Developers Console: Google API Console|API Console
  Google account: Google Account
  Google accounts: Google Accounts
  Googling: search with Google
  HTTPs: HTTPS
  k8s: Kubernetes
  SHA1: SHA-1|HAS-SHA1
  sign-?on: single sign-on
  url: URL
  World Wide Web: web
