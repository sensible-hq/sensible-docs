StylesPath = .github/styles
MinAlertLevel = suggestion

Packages = Google

Vocab = Sensible

[*.md]
BasedOnStyles = Vale, Google, Sensible
Google.WordList = NO
Google.Colons = NO
# Sensible.EmDash replaces it: the house rule bans em dashes, not only spaced ones.
Google.EmDash = NO
# Changelog-only rules; turned on in the changelog section below.
Sensible.ChangelogImage = NO
Sensible.ChangelogHeadings = NO

# Changelog drafts, and their rule fixtures. Changelogs use JSX images, so NoJSXImage is off.
[{drafts/*changelog*.md,style-rules/tests/changelog-*.md}]
BasedOnStyles = Vale, Google, Sensible
Google.WordList = NO
Google.Colons = NO
Google.EmDash = NO
Sensible.NoJSXImage = NO
Sensible.ChangelogImage = YES
Sensible.ChangelogHeadings = YES

[.claude/**]
BasedOnStyles =
