  enforced_by:
    script: [scripts/style/check_code_blocks.py]
  stated_in:
    - file: .claude/style-guide/sentence-word-guidance.md
      quote: Use `/* */` for all comments in JSON configs, including single-line comments. Don't use `//`.
    - file: .claude/style-guide/json5-comments-reference.md
      quote: Fence the code block as ` ```json `, not ` ```json5 `
    - file: .claude/style-guide/blog-post-template.md
      quote: fence code blocks as ` ```json ` so drafts and docs share one form
  origin: [memory feedback_keep_code_fence_language, memory feedback_block_comments_only]
  notes: The write-time hook runs this script on the edited file.

