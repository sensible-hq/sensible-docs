# Style rule registry: one entry per rule, linking where the rule is stated in prose (stated_in: guides,
# templates, skills the model reads) to what enforces it (enforced_by: Vale rules, scripts, Jev judgment
# specs). scripts/style/check_registry.py fails when the two sides drift apart. See style-rules/README.md.
#
# kind:  deterministic  a pattern or script settles it
#        judgment       a detector finds candidates; Jev (or a reviewer) decides, using the spec
#        prose          no check; the guide is the only carrier
# gate:  block          the write-time hook denies an edit that adds a hit (deterministic rules only)
#        warn           the hook reports hits on changed lines after the edit
#        report         CI and manual runs only
# map_id: the rule's ID in design/style-system-map.md

# ---------------------------------------------------------------- deterministic: Vale

- id: sensible-em-dash
  map_id: D2
  statement: Don't use em dashes. Split the sentence, or use a colon or parentheses.
  kind: deterministic
  gate: block
  enforced_by:
    vale: [Sensible.EmDash]
  stated_in:
    - file: .claude/style-guide/writing-rules.md
      quote: Do not use em dashes to join compound clauses. Split into two sentences instead.
    - file: .claude/style-guide/style-guide-overview.md
      quote: "**Em dashes:** Do not use em dashes to join compound clauses."
  fixture: style-rules/tests/sensible-em-dash.md
  notes: Replaces Google.EmDash, which banned only spaced dashes.

