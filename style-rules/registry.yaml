# ---------------------------------------------------------------- prose only

- id: sensible-realistic-example-data
  statement: Pick example data that shows why the feature is useful, not placeholder rows.
  kind: prose
  stated_in:
    - file: .claude/preferences/editorial-preferences.md
      quote: "**Use realistic, meaningful example data.**"

- id: sensible-compare-only-with-choice
  statement: Compare Sensible features only when the reader chooses between them, and say when to pick each.
  kind: prose
  stated_in:
    - file: .claude/preferences/editorial-preferences.md
      quote: "**Compare to other Sensible features if the user can choose between them.**"

- id: sensible-changelog-ui-first
  statement: When a change affects both the app and the API, the changelog entry leads with the app.
  kind: prose
  stated_in:
    - file: .claude/preferences/editorial-preferences.md
