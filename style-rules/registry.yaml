  kind: judgment
  enforced_by:
    judgment: [style-rules/judgment/sensible-opening-sentence.yaml]
  stated_in:
    - file: .claude/style-guide/style-guide-overview.md
      quote: "**Opening paragraph:** Use third-person present tense."
    - file: .claude/skills/revise-doc-style/SKILL.md
      quote: "Exception: a feature whose input the user supplies"
    - file: .claude/style-guide/friction-log.md
      quote: Reference pages open in third person ("Extracts…")
  origin: [memory feedback_excerpt_rules, memory feedback_you_centric_style]

- id: sensible-explicit-actor
  map_id: J2
  statement: Name who acts. The user makes the choices ("you"); Sensible carries them out. Never flip an existing "you" sentence.
  kind: judgment
  gate: judge
  enforced_by:
    vale: [Google.Passive]
    judgment: [style-rules/judgment/sensible-explicit-actor.yaml]
  stated_in:
    - file: .claude/style-guide/writing-rules.md
      quote: Where the two meet, the user makes the choices and Sensible carries them out
    - file: .claude/skills/revise-doc-style/SKILL.md
      quote: Don't change an existing "you" sentence to make the feature or "Sensible" the subject.
  origin: [memory feedback_you_centric_style, .claude/sessions/xml-postprocessor-docs/friction-log.md]
  notes: Google.Passive is the detector; the judgment spec decides.

- id: sensible-gerunds
  map_id: J3
  statement: Prefer gerunds over nominalizations ("automates extracting", not "automates the extraction of").
  kind: judgment
  enforced_by:
    judgment: [style-rules/judgment/sensible-gerunds.yaml]
  stated_in:
    - file: .claude/style-guide/writing-rules.md
      quote: Use the verb form directly rather than a noun derived from it.
    - file: .claude/style-guide/sentence-word-guidance.md
      quote: "**Prefer gerunds over nominalizations.**"

- id: sensible-scenario-first
  map_id: J4
  statement: Lead with what the user experiences or achieves, then explain how to configure it.
  kind: judgment
  enforced_by:
    judgment: [style-rules/judgment/sensible-scenario-first.yaml]
  stated_in:
    - file: .claude/skills/revise-doc-style/SKILL.md
      quote: Lead with what the user experiences or achieves, not with internal structure
    - file: .claude/preferences/editorial-preferences.md
      quote: "**Scenario-first, not mechanism-first.**"

- id: sensible-context-terms
  map_id: J5
  statement: Glossary terms with a legitimate meaning elsewhere ("response", "segment", "section", "key", "empty", "free form") are right or wrong by context.
  kind: judgment
  enforced_by:
    judgment: [style-rules/judgment/sensible-context-terms.yaml]
  stated_in:
    - file: .claude/style-guide/glossary.md
      quote: Terms whose avoided form has a legitimate meaning elsewhere
    - file: .claude/skills/docs-checker/SKILL.md
      quote: Some glossary terms have a legitimate meaning elsewhere, so no pattern can flag them.

- id: sensible-no-table-for-unconfigurable
  map_id: J6
  statement: Don't put values the user can't configure in a table; a table implies configurability.
  kind: judgment
  enforced_by:
    judgment: [style-rules/judgment/sensible-no-table-for-unconfigurable.yaml]
  stated_in:
    - file: .claude/preferences/editorial-preferences.md
      quote: If the user can't directly configure a set of values via the API or UI, don't document those values in a table.

