# Sections of skills, templates, and preferences that Jev ties to a registered rule (skill_rules.py), reviewed and
# cleared. reason says why the pair is compatible; "Review:" marks a call for Frances.
- file: .claude/skills/api-spec/SKILL.md
  heading: 'Step 10: Update spec examples from real API output'
  rule: sensible-example-var
  reason: OpenAPI examples carry real API values; the var rule is about SenseML examples.
- file: .claude/skills/api-spec/configuration-source-of-truth.md
  heading: Fields deliberately not publicly documented
  rule: sensible-no-table-for-unconfigurable
  reason: An internal reference for the skill, not a docs page.
- file: .claude/skills/api-spec/extraction-source-of-truth.md
  heading: extract_from_url request body
  rule: sensible-key-column-plain
  reason: An internal reference for the skill, not a docs parameter table.
- file: .claude/skills/blog-how-to-parse-x/SKILL.md
  heading: Step 5 — Draft the blog post
  rule: sensible-code-fences
  reason: 'Blog posts aren''t ReadMe pages; the json5 fence and CONFIG markers feed the blog pipeline. Review: does
    the rule''s scope need to say docs pages only?'
- file: .claude/skills/create-docs-example/SKILL.md
  heading: Step 6 — Write the example section
  rule: sensible-example-heading-verb
  reason: Says when to add example headings, not how to name them; compatible.
- file: .claude/skills/quickbooks/SKILL.md
  heading: 'Phase 4: Run the integration'
  rule: sensible-internal-terms
  reason: A tutorial skill that runs code with the user; the AWS and auth terms are the user's own setup.
- file: .claude/skills/revise-doc-style/SKILL.md
  heading: Examples structure
  rule: sensible-integrate-before-heading
  reason: Example headings sit under Examples; the pair is resolved in the registry.
- file: .claude/skills/style-guide-generator-senseml/SKILL.md
