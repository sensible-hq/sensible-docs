# Judgment spec for Jev. Registry entry: sensible-parent-link in style-rules/registry.yaml.
id: sensible-parent-link
source:
  file: .claude/sessions/xml-postprocessor-docs/friction-log.md
  heading: 6. Wrong link target in jsonlogic.md
  quote: consider whether a link to the parent index is more durable than a link to the specific child page
applies: links whose target changed in a docs PR
check:
  kind: judgment
  detector: 'a doc: link target changed in the diff from one slug to another'
  precheck: skip links in a list that names each child page on purpose
  question:
    type: choice
    ask: Does the new link point at the most durable page for this mention, and does the surrounding text agree
      with it?
    criteria:
      durable: a general mention links the parent index; a specific mention links the child page; article and noun
        match the link text
      too-specific: a general mention links one child page; link the parent index
      mismatch: the article or noun no longer agrees with the link ("a [postprocessors]"); fix the words
      other: none of these
examples:
  fail: Sensible returns [postprocessed](doc:json-postprocessor) output.
  pass: Sensible returns [postprocessed](doc:postprocessors) output.
fix: link the parent index for a general mention, and make the article and noun agree
