# Judgment spec for Jev. Registry entry: sensible-gerunds in style-rules/registry.yaml.
# check.find: the detector judge.py runs. check.verdicts: the choices that break the rule.
id: sensible-gerunds
source:
  file: .claude/style-guide/writing-rules.md
  heading: Gerunds over nominalizations
  quote: Use the verb form directly rather than a noun derived from it.
applies: prose sentences in docs/
check:
  kind: judgment
  detector: '''\bthe \w+(?:tion|ment|ance|ing)s? of\b'''
  precheck: skip fixed terms such as "the result of", "the end of", "the rest of"
  question:
    type: choice
    ask: Is the marked noun a verb in disguise that the sentence could use directly?
    criteria:
      nominalization: '"automates the extraction of data"; rewrite with the gerund ("automates extracting data")'
      noun: the noun names a thing, not an action ("the configuration of this document type" meaning the config);
        fine
      other: none of these
  find:
    kind: sentences
    pattern: \bthe \w+(?:tion|ment|ance)s? of\b
    exclude: \bthe (?:result|end|rest|start|top|bottom) of\b
  verdicts:
    violation:
    - nominalization
examples:
  fail: Sensible automates the extraction of structured data.
  pass: Sensible automates extracting structured data.
fix: replace 'the X-tion of Y' with the gerund 'X-ing Y'
calibration:
  precision: 1.0
  recall: 0.25
  violations: 4
  agreement: 0.57
  choice_agreement: 0.71
  cases: 7
  model: jev-1.14.0
  date: '2026-11-17'
  labels: labels/sensible-gerunds.yaml
