# Pairs of style rules you've ruled on, so scripts/style/check_overlap.py stops reporting them.
#
# - pair: [rule-a, rule-b]
#   verdict: distinct | duplicate-kept | conflict-accepted | unreviewed
#   hash: <12 characters; check_overlap.py prints it for an open pair>
#   note: why, in a sentence
#
# `unreviewed` marks a known pair nobody has ruled on yet: the weekly report lists it without failing.
# Replace it with a real verdict once you've looked.
#
# The hash covers both rules' statements. Rewording either one reopens the pair. A conflict where one
# rule should win belongs in the registry instead, as `overrides: [loser]` on the winner.
- pair:
  - sensible-excerpt-length
  - sensible-terminology
  verdict: distinct
  hash: dcafcebd370b
  note: A length cap and a word choice don't pull against each other.
- pair:
  - sensible-explicit-actor
  - sensible-terminology
  verdict: distinct
  hash: 93c0863c9552
  note: Who acts and which term names a thing are independent.
- pair:
  - sensible-link-article
  - sensible-parent-link
  verdict: distinct
  hash: f7ff01fe8cd9
  note: parent-link tells you to update the article, which is what link-article checks.
- pair:
  - sensible-excerpt-self-naming
  - sensible-terminology
  verdict: distinct
  hash: 2f8990abdaf3
  note: An excerpt can use the glossary term without naming its own page.
- pair:
  - google-latin
  - sensible-copy-sibling-wording
